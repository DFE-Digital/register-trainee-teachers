default: &default
  store_options:
    # No age expiry, matching the Redis cache this replaces.
    # The gem defaults to 2 weeks when it is absent.
    max_age: <%= nil %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>
    expiry_method: :job

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
