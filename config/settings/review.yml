trs:
  base_url: https://test.teacher-qualifications-api.education.gov.uk/

features:
  home_text: true
  sign_in_method: persona
  enable_feedback_link: true
  publish_course_details: true
  user_can_have_multiple_organisations: true
  funding: true
  # Funding management, the funding eligibility journey and the EYTDA route, to review.
  funding_management: true
  funding_management_edit: true
  funding_management_approval: true
  funding_eligibility_step: true
  funding_draft_amounts_in_journey: true
  routes:
    early_years_teacher_degree_apprenticeship: true
  google:
    send_data_to_big_query: true

pagination:
  records_per_page: 30

environment:
  name: review
  display_name: Review

api:
  allowed_versions: [v2026.1, v2027.0]

bulk_update:
  add_trainees:
    version: v2026.1
