      summary: index
      tags:
      - Api::Trainee
      parameters:
      - name: academic_cycle
        in: query
        required: false
        schema:
          oneOf:
          - type: integer
          - type: string
        example: not-a-number
      - name: api_version
        in: path
        required: true
        schema:
          type: string
        example: v2027.0
      - name: has_trn
        in: query
        required: false
        schema:
          type: boolean
        example: false
      - name: page
        in: query
        required: false
        schema:
          type: integer
        example: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
        example: 5
      - name: since
        in: query
        required: false
        schema:
          type: string
        example: 2023-13-01
      - name: sort_order
        in: query
        required: false
        schema:
          type: string
        example: asc
      - name: status
        in: query
        required: false
        schema:
          type: string
        example: invalid_state
